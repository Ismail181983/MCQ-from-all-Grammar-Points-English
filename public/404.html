<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MCQ from all Grammar Points</title>
    <script>
      // Single Page Apps for GitHub Pages
      // Redirects to root with path if any subroute is accessed
      var path = window.location.pathname;
      var repo = path.split('/')[1] || '';
      if (repo && !path.endsWith('/')) {
        window.location.replace('/' + repo + '/');
      } else {
        window.location.replace('./');
      }
    </script>
  </head>
  <body style="background:#020617;color:#f8fafc;font-family:sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;">
    <p>Loading application...</p>
  </body>
</html>
